name: AVENEL CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Build & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avenel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          npm install --no-fund --no-audit

      - name: Run Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit || true

      - name: Initialize PostgreSQL Roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d avenel -f docker/postgres/init-roles.sql
        env:
          PGPASSWORD: postgres

      - name: Test Migrations Forward (Up)
        run: |
          make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Test Migrations Rollback (Down)
        run: |
          make migrate-down
          make migrate-down
          make migrate-down
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Re-apply Migrations for Test Suite
        run: |
          make migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel

      - name: Run Lint
        run: |
          make lint
        env:
          PYTHON: python

      - name: Verify Test Count Invariant
        run: |
          python scripts/check_test_count.py
        env:
          PYTHON: python

      - name: Run Typecheck
        run: |
          make typecheck
        env:
          PYTHON: python

      - name: Run OpenAPI Lint
        run: |
          make openapi-lint

      - name: Run RLS Check
        run: |
          make rls-check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Run Hash-Chained Audit Verify
        run: |
          make audit-verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Run Automated Tests
        run: |
          make test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          PYTHON: python

      - name: Web — generated API client matches contract
        run: make web-gen-api

      - name: Web — typecheck
        run: make web-typecheck

      - name: Web — unit tests and test-count baseline
        run: make web-test

      - name: Web — Part E palette check on built CSS
        run: make css-check

      - name: Guards — Part K 25, 26, 27
        run: make guards

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform Configuration
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - name: Run Backup & Restore Verification Drill
        run: |
          python scripts/test_backup_restore.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenel
          AVENEL_KMS_KEY: "avenel-test-kms-key-fixture-32chars-min-ok"

  e2e-stack:
    # Part K 28: browser e2e against the real docker-compose stack. No Postgres service here:
    # the compose stack owns ports 5432, 8000, 8080 and 5173.
    name: E2E against docker-compose (Keycloak + API + DB)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start stack, require health, run e2e (make e2e)
        run: make e2e
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            docs/reports/phase-5c-1/
            playwright-report/
            test-results/
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > compose.log; tail -300 compose.log
