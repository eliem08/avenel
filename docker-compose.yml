services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: avenel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: avenel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avenel"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: avenel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    container_name: avenel-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Fixed public issuer so browser (localhost) and API (container network) agree on `iss`.
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak/realm-export-test.json:/opt/keycloak/data/import/avenel-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    container_name: avenel-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 300s

  freshclam:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    container_name: avenel-freshclam
    restart: unless-stopped
    command: ["freshclam", "-d", "--foreground", "-c", "24"]
    # The image healthcheck pings clamd, which does not run in this container.
    healthcheck:
      disable: true
    volumes:
      - clamav_db:/var/lib/clamav

  ocr:
    # STUB: The OCR service is currently a placeholder mock/stub (python http.server). Production OCR engine to be integrated in Phase 2.
    image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    container_name: avenel-ocr-stub
    labels:
      - "avenel.service=ocr-stub"
      - "avenel.status=stub"
    restart: unless-stopped
    command: python -m http.server 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- AVENEL application (Phase 5c-1). AVENEL_AUTH_TEST_MODE is never set here. ---
  migrate:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    container_name: avenel-migrate
    command: ["python", "avenel/infrastructure/migrations.py", "up"]
    environment:
      DATABASE_URL: "postgresql://avenel_owner:avenel_owner_secret@postgres:5432/avenel"
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    container_name: avenel-seed
    command: ["python", "scripts/seed_e2e.py"]
    environment:
      SEED_DATABASE_URL: "postgresql://avenel_owner:avenel_owner_secret@postgres:5432/avenel"
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    container_name: avenel-api
    restart: unless-stopped
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--access-log"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://avenel_app:avenel_app_secret@postgres:5432/avenel"
      AVENEL_KMS_KEY: "avenel-dev-kms-key-for-docker-compose-only-32c"
      AVENEL_CLAMAV_HOST: "clamav"
      AVENEL_CLAMAV_PORT: "3310"
      KEYCLOAK_ISSUER: "http://localhost:8080/realms/avenel"
      KEYCLOAK_AUDIENCE: "avenel-api"
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/avenel/protocol/openid-connect/certs"
      STORAGE_BACKEND: "filesystem"
    depends_on:
      seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    container_name: avenel-worker
    restart: unless-stopped
    command: ["python", "-m", "avenel.jobs.worker"]
    environment:
      DATABASE_URL: "postgresql://avenel_app:avenel_app_secret@postgres:5432/avenel"
      AVENEL_KMS_KEY: "avenel-dev-kms-key-for-docker-compose-only-32c"
      AVENEL_CLAMAV_HOST: "clamav"
      AVENEL_CLAMAV_PORT: "3310"
      KEYCLOAK_ISSUER: "http://localhost:8080/realms/avenel"
      KEYCLOAK_AUDIENCE: "avenel-api"
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/avenel/protocol/openid-connect/certs"
      STORAGE_BACKEND: "filesystem"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/proc/1/cmdline') and b'avenel.jobs.worker' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: { context: ., dockerfile: docker/Dockerfile.web }
    container_name: avenel-web
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  clamav_db:
